# Cargo build optimizations

[build]
# Parallel job count is left unset: cargo already defaults to the number of
# logical CPUs. An explicit `jobs = 0` once meant the same thing but is now
# rejected ("error: jobs may not be 0"), which blocked every cargo invocation.

# Disable incremental compilation (incompatible with sccache)
incremental = false

[target.x86_64-unknown-linux-gnu]
# Use mold linker for faster linking (10x faster than ld)
linker = "clang"
rustflags = ["-C", "link-arg=-fuse-ld=mold"]

[target.aarch64-unknown-linux-gnu]
# Use mold linker for ARM64 as well
linker = "clang"
rustflags = ["-C", "link-arg=-fuse-ld=mold"]

# Network optimizations
[net]
git-fetch-with-cli = true  # Use git CLI for better performance
