# GitLab Log Parser Config
# Use with: ilog-agent -c config.toml -p examples/gitlab-parser.yaml

sources:
  # GitLab Production JSON logs
  - name: gitlab-production
    path: /var/log/gitlab/gitlab-rails/production_json.log
    format: json
    # Auto-extract all JSON fields

  # GitLab API JSON logs
  - name: gitlab-api
    path: /var/log/gitlab/gitlab-rails/api_json.log
    format: json
    fields:
      - name: trace_id
        from: correlation_id
      - name: duration_ms
        from: duration
        field_type: float

  # GitLab NGINX Access Logs
  - name: gitlab-nginx-access
    path: /var/log/gitlab/nginx/gitlab_access.log
    format: regex
    pattern: '^(?P<ip>\S+) - (?P<user>\S+) \[(?P<time>[^\]]+)\] "(?P<method>\S+) (?P<path>\S+) (?P<proto>\S+)" (?P<status>\d+) (?P<bytes>\d+)'
    fields:
      - name: http.client_ip
        from: ip
      - name: http.method
        from: method
      - name: http.path
        from: path
      - name: http.status_code
        from: status
        field_type: int
      - name: http.bytes_sent
        from: bytes
        field_type: int

  # GitLab Shell logs (JSON)
  - name: gitlab-shell
    path: /var/log/gitlab/gitlab-shell/gitlab-shell.log
    format: json

  # Gitaly logs (JSON)
  - name: gitaly
    path: /var/log/gitlab/gitaly/current
    format: json
